# Postgres for integration tests.
#
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:55432/nexus_test npm run test:integration
#
# A plain Postgres is enough: the tests swap Neon's HTTP driver for `pg`
# (server/test-support/pg-neon-adapter.ts), so no websocket proxy is involved.
# The port is deliberately unusual so it cannot collide with a local Postgres.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_test
    ports:
      - "55432:5432"
    # Data is disposable; keeping it in memory makes the full migration run fast.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_test"]
      interval: 2s
      timeout: 3s
      retries: 30
